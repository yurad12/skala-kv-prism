[project]
name = "kvprism"
version = "0.1.0"
description = "KV cache 최적화 기술 다관점 평가 Agentic RAG (LangGraph)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 에이전트 · 그래프
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # RAG
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2",
    # 도구
    "tavily-python>=0.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # 보고서
    "markdown-pdf>=1.4",
    # 공통
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
