# RAG 파이프라인 설정 (설계 문서 2.2 ~ 2.3)
embedding_model: BAAI/bge-m3
chunk_size: 800            # 글자 수
chunk_overlap: 100
candidate_k: 10            # 각 검색기가 융합 전에 내는 순위 길이 (MRR 계산 범위와 동일)
rrf_k: 60
top_k: 5                   # rag_retrieve 기본 반환 개수

papers_dir: data/papers    # 운영 문서 풀 (선정 기술 2편)
index_dir: outputs/index   # Chroma + BM25 저장 위치. 있으면 다시 만들지 않는다

# 검색 평가 전용 (설계 단계 벤치마크: 후보 6편 136쪽, dev 24 / val 12 문항)
eval_papers_dir: data/papers/eval
eval_index_dir: outputs/index_eval
qa_dev: data/qa/dev.json
qa_val: data/qa/val.json

# doc_id = PDF 파일명(stem). tag 는 인용 태그 [TQ p.7] 의 접두어
docs:
  turboquant:
    tag: TQ
    title: "TurboQuant: Online Vector Quantization with Near-optimal Distortion Rate"
    authors: "Zandieh, A. et al."
    published: 2025-04-28
    arxiv: "2504.19874"
  itme:
    tag: ITME
    title: "ITME: Inference Tiered Memory Expansion with Disaggregated CXL-Hybrid Memories"
    authors: "Jang, H. et al. (SK hynix)"
    published: 2026-06-10
    arxiv: "2606.12556"
  # 아래 4편은 벤치마크(eval) 코퍼스에만 쓴다
  kivi:
    tag: KIVI
    title: "KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache"
    authors: "Liu, Z. et al."
    published: 2024-02-05
    arxiv: "2402.02750"
  deepseek_v2:
    tag: DSV2
    title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model"
    authors: "DeepSeek-AI"
    published: 2024-05-07
    arxiv: "2405.04434"
  infinigen:
    tag: INFG
    title: "InfiniGen: Efficient Generative Inference of Large Language Models with Dynamic KV Cache Management"
    authors: "Lee, W. et al."
    published: 2024-06-28
    arxiv: "2406.19707"
  cxl_pnm:
    tag: PNM
    title: "Scalable Processing-Near-Memory for 1M-Token LLM Inference: CXL-Enabled KV-Cache Management Beyond GPU Limits"
    authors: "Kim, S. et al."
    published: 2025-11-01
    arxiv: "2511.00321"
